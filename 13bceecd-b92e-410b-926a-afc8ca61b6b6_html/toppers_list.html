<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 1000px;
            border: 2px solid black;
            padding: 20px;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .logo {
            width: 80px;
        }
        .title-section {
            text-align: center;
            flex-grow: 1;
        }
        .main-title {
            color: #E34234;
            font-size: 48px;
            font-weight: bold;
            margin: 0;
        }
        .sub-title {
            color: #E34234;
            font-size: 20px;
            font-weight: bold;
            margin: 5px 0;
        }
        .contact-info {
            text-align: right;
            color: #E34234;
            font-weight: bold;
            font-size: 18px;
        }
        .list-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
            text-decoration: none;
        }
        .class-batch {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th {
            background-color: #E67E22;
            color: white;
            font-size: 22px;
            padding: 12px;
            border: 2px solid #D35400;
        }
        td {
            border: 2px solid #D35400;
            padding: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #FFF5EE;
        }
        .marks {
            color: #E34234;
            font-size: 22px;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 30px;
        }
        .congrats {
            color: #E34234;
            font-size: 36px;
            font-style: italic;
        }
        .signature {
            width: 150px;
        }
    </style>
</head>
