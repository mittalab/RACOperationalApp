<html>
<head>
<title>Result</title>
<style>
    body {
        font-family: sans-serif;
        width: 800px;
        margin: auto;
    }
    .header-img {
        width: 100%;
    }
    .center-text {
        text-align: center;
    }
    .split-row {
        display: flex;
        width: 100%;
        justify-content: space-between;
    }
    .signature-img {
        width: 150px;
        float: right;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 2em;
    }
    th, td {
        border: 1px solid black;
        background-color: #e0ffe0;
        padding: 8px;
        text-align: left;
    }
    td:first-child, th:first-child {
        white-space: nowrap;
    }
    watermarked-container {
<!--        position: relative;-->
<!--        display: inline-block;-->
        background-image: url('WATERMARK_IMAGE');
        background-repeat: no-repeat; /* or repeat, no-repeat, depending on your design */
        opacity: 100; /* adjust for watermark visibility */
        /* other positioning and sizing styles */
    }
    watermark-image {
        position: absolute; /* Positions the watermark relative to the container */
        bottom: 10px;       /* Adjust vertical position (e.g., from bottom) */
        right: 10px;        /* Adjust horizontal position (e.g., from right) */
        opacity: 0.5;       /* Sets transparency (0.0 to 1.0) */
        pointer-events: none; /* Allows clicks to pass through the watermark to the main image */
        width: 100px;       /* Set an appropriate size for the watermark */
        height: auto;
    }
</style>
</head>
<body>
<div class="watermarked-container">
<!--
<img class="watermark-image" src="WATERMARK__IMAGE" alt="CONFIDENTIAL">
-->
    <img class="header-img" src="HEADER_IMAGE" alt="Header">

    <h1 class="center-text">HEADING_INPUT</h1>

    <div class="split-row">
        <span><strong>DATE: DATE_INPUT</strong></span>
        <span><strong>CLASS: CLASS_INPUT</strong></span>
    </div>

    <h2 class="center-text">NAME: NAME_INPUT</h2>
    <h3 class="center-text">TOPIC: TOPIC_INPUT</h3>

    <table>
        <tr>
            <td>Wrong Answer Number</td>
            <td>ADDITIONAL_INPUT</td>
        </tr>
        <tr>
            <td>Marks Deducted</td>
            <td>MARKS_DEDUCTED_INPUT</td>
        </tr>
        <tr>
            <td>Total Marks</td>
            <td>MARKS_INPUT/TOTAL_MARKS_INPUT</td>
        </tr>
    </table>

    <img class="signature-img" src="SIGNATURE_IMAGE" alt="Signature">
</div>
</body>
</html>
